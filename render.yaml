# Only needed if you want the optional Python AI server online.
services:
  - type: web
    name: career-profile-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ALLOWED_ORIGIN
        sync: false      # your website address, e.g. https://my-resume.vercel.app
